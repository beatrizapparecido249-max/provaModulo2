<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>💰 Gestão Financeira</h1>
    </header>

    <section class="summary-grid">
      <div class="summary-card card-receita">
        <span class="card-label">RECEITAS</span>
        <h2 id="total-receitas">R$ 0,00</h2>
      </div>
      <div class="summary-card card-despesa">
        <span class="card-label">DESPESAS</span>
        <h2 id="total-despesas">R$ 0,00</h2>
      </div>
      <div class="summary-card card-saldo">
        <span class="card-label">SALDO TOTAL</span>
        <h2 id="saldo-total">R$ 0,00</h2>
      </div>
    </section>

    <section class="content-card">
      <h2>Novo Lançamento</h2>
      <form id="transacao-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Salário, Mercado" required />
          </div>
          <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0.00" required />
          </div>
          <div class="form-group">
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="receita">Receita (+)</option>
              <option value="despesa">Despesa (-)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary">Adicionar Transação</button>
      </form>
    </section>

    <section class="content-card">
      <div class="chart-header">
        <h2>Painel Analítico de Lançamentos</h2>
        <div class="chart-actions">
          <button type="button" class="btn-chart-type active" data-type="bar">Barras</button>
          <button type="button" class="btn-chart-type" data-type="line">Evolução</button>
          <button type="button" class="btn-chart-type" data-type="doughnut">Proporção</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="graficoFinanceiro"></canvas>
      </div>
    </section>

    <section class="content-card">
      <h2>Histórico de Transações</h2>
      <ul id="lista-transacoes"></ul>
    </section>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
